<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111418">
<script src="config.js"></script>
<title>Pastebin</title>
<style>
  :root { --bg:#111418; --card:#1a1f26; --fg:#e8ecf1; --muted:#8b95a3; --accent:#4f9cff; --danger:#ff6b6b; --ok:#4ade80; --border:#2a313b; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f6f9; --card:#fff; --fg:#1a1f26; --muted:#667085; --accent:#1f6feb; --danger:#d92d20; --ok:#16a34a; --border:#d9dee5; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 12px; display:flex; justify-content:space-between; align-items:center; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px; }
  textarea, input { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:10px; font:inherit; }
  textarea { min-height:120px; resize:vertical; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:15px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 14px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--border); font-weight:500; }
  button.danger { color:var(--danger); }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; }
  .meta { color:var(--muted); font-size:13px; }
  pre { margin:8px 0 0; white-space:pre-wrap; word-break:break-word; font:14px/1.45 ui-monospace,Menlo,Consolas,monospace; max-height:240px; overflow:auto; }
  pre.open { max-height:none; }
  #status { font-size:13px; color:var(--muted); }
  #status.err { color:var(--danger); }
  #status.ok { color:var(--ok); }
  .hidden { display:none; }
  small a { color:var(--accent); }
  body.drag main { outline:2px dashed var(--accent); outline-offset:-8px; }
  .fname { font-weight:600; word-break:break-all; margin-top:6px; }
</style>
</head>
<body>
<main>
  <h1>📋 Pastebin <button class="ghost" id="logout" title="Выйти">⚙</button></h1>

  <section id="setup" class="card hidden">
    <div id="pinForm" class="hidden">
      <p><b>Введи PIN-код</b></p>
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="PIN">
      <div class="row"><button id="pinGo">Войти</button><span id="pinErr" class="grow" style="color:var(--danger)"></span></div>
    </div>
    <div id="sealForm" class="hidden">
      <p><b>Первая настройка.</b> Токен GitHub шифруется PIN-кодом, дальше на устройствах нужен только PIN.
      Токен (classic, scope <code>gist</code>): <small><a href="https://github.com/settings/tokens/new?scopes=gist&description=pastebin" target="_blank" rel="noopener">создать</a></small></p>
      <input id="token" type="password" placeholder="ghp_..." autocomplete="off">
      <input id="newPin" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="Новый PIN" autocomplete="off" style="margin-top:8px">
      <div class="row"><button id="sealGo">Создать config.js</button><span id="sealErr" class="grow" style="color:var(--danger)"></span></div>
      <div id="sealOut" class="hidden">
        <p class="meta">Сохрани этот текст как <code>config.js</code> в корне репо рядом с <code>index.html</code> и закоммить. На других устройствах после деплоя хватит PIN-кода.</p>
        <textarea id="sealText" readonly style="min-height:90px"></textarea>
        <div class="row"><button class="ghost" id="sealCopy">Копировать</button><button id="sealDone">Продолжить</button></div>
      </div>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <textarea id="text" placeholder="Вставь текст или ссылку… (Ctrl+Enter — отправить)"></textarea>
      <div class="row">
        <button id="send">Отправить</button>
        <button class="ghost" id="paste">Из буфера</button>
        <button class="ghost" id="attach">📎 Файлы</button>
        <input type="file" id="file" multiple hidden>
        <span id="status" class="grow"></span>
      </div>
    </div>
    <div id="list"></div>
  </section>
</main>

<script>
const API = 'https://api.github.com';
const DESC = 'pastebin-data';
const FDESC = 'pastebin-files';
const $ = id => document.getElementById(id);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} },
};
let token = store.get('pb_token');
let gistId = store.get('pb_gist');
let filesId = store.get('pb_files');
const MAX_FILE = 10 * 1024 * 1024; // лимит Gist API на запрос, с запасом под base64
let lastSig = '';

// --- PIN: токен лежит в config.js зашифрованным (PBKDF2 + AES-GCM) ---
const ITER = 600000;
const b64e = u => btoa(String.fromCharCode(...u));
const b64d = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function deriveKey(pin, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function seal(tok, pin) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await deriveKey(pin, salt, ITER), new TextEncoder().encode(tok));
  return { iter: ITER, salt: b64e(salt), iv: b64e(iv), ct: b64e(new Uint8Array(ct)) };
}
async function unseal(pin, c) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(c.iv) }, await deriveKey(pin, b64d(c.salt), c.iter), b64d(c.ct));
  return new TextDecoder().decode(pt);
}

function status(msg, cls = '') { const s = $('status'); s.textContent = msg; s.className = cls; if (msg) setTimeout(() => { if (s.textContent === msg) s.textContent = ''; }, 3000); }

async function gh(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
  });
  if (r.status === 401) { logout(); throw new Error('Токен не подходит'); }
  if (!r.ok) throw new Error('GitHub ' + r.status);
  return r.status === 204 ? null : r.json();
}

async function ensureGist() {
  if (gistId && filesId) return;
  const found = {};
  for (let page = 1; page <= 5 && !(found[DESC] && found[FDESC]); page++) {
    const list = await gh(`/gists?per_page=100&page=${page}`);
    if (!list.length) break;
    for (const g of list) if ((g.description === DESC || g.description === FDESC) && !found[g.description]) found[g.description] = g.id;
  }
  const make = async d => (await gh('/gists', { method: 'POST', body: JSON.stringify({ description: d, public: false, files: { 'README.md': { content: d } } }) })).id;
  gistId = found[DESC] || await make(DESC);
  filesId = found[FDESC] || await make(FDESC);
  store.set('pb_gist', gistId); store.set('pb_files', filesId);
}

async function load() {
  try {
    await ensureGist();
    const g = await gh('/gists/' + gistId);
    const items = (await Promise.all(Object.values(g.files).map(async f => {
      const ts = parseInt(f.filename, 10) || 0;
      if (f.filename.endsWith('.txt')) {
        let content = f.content;
        if (f.truncated) content = await (await fetch(f.raw_url)).text();
        return { kind: 'text', name: f.filename, content, ts };
      }
      if (f.filename.endsWith('.meta.json')) {
        try { return { kind: 'file', name: f.filename, meta: JSON.parse(f.content), ts }; } catch { return null; }
      }
      return null;
    }))).filter(Boolean);
    items.sort((a, b) => b.ts - a.ts);
    const sig = items.map(i => i.name).join('|');
    if (sig !== lastSig) { lastSig = sig; render(items); }
  } catch (e) { status(e.message, 'err'); }
}

function fmtSize(n) { return n < 1024 ? n + ' Б' : n < 1048576 ? (n / 1024).toFixed(1) + ' КБ' : (n / 1048576).toFixed(1) + ' МБ'; }

function fileCard(it, card) {
  const m = it.meta;
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.textContent = new Date(it.ts).toLocaleString('ru-RU') + ' · ' + fmtSize(m.size);
  const name = document.createElement('div'); name.className = 'fname'; name.textContent = '📎 ' + m.name;
  const row = document.createElement('div'); row.className = 'row';
  const dl = document.createElement('button'); dl.textContent = 'Скачать';
  dl.onclick = async () => {
    dl.disabled = true; dl.textContent = 'Загрузка…';
    try {
      const b64 = (await (await fetch(m.url)).text()).trim();
      const bytes = await (await fetch('data:application/octet-stream;base64,' + b64)).blob();
      const url = URL.createObjectURL(new Blob([bytes], { type: m.type || 'application/octet-stream' }));
      const a = document.createElement('a'); a.href = url; a.download = m.name; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) { status('Не удалось скачать', 'err'); }
    dl.disabled = false; dl.textContent = 'Скачать';
  };
  const del = document.createElement('button'); del.className = 'ghost danger'; del.textContent = 'Удалить';
  del.onclick = async () => {
    del.disabled = true;
    try {
      await gh('/gists/' + filesId, { method: 'PATCH', body: JSON.stringify({ files: { [m.blob]: null } }) });
      await gh('/gists/' + gistId, { method: 'PATCH', body: JSON.stringify({ files: { [it.name]: null } }) });
      card.remove(); lastSig = '';
    } catch (e) { status(e.message, 'err'); del.disabled = false; }
  };
  const sp = document.createElement('span'); sp.className = 'grow';
  row.append(dl, sp, del);
  return [meta, name, row];
}

function render(items) {
  const list = $('list');
  list.textContent = '';
  if (!items.length) { list.innerHTML = '<p class="meta" style="text-align:center">Пока пусто</p>'; return; }
  for (const it of items) {
    const card = document.createElement('div'); card.className = 'card';
    if (it.kind === 'file') { card.append(...fileCard(it, card)); list.append(card); continue; }
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = new Date(it.ts).toLocaleString('ru-RU') + ' · ' + it.content.length + ' симв.';
    const pre = document.createElement('pre'); pre.textContent = it.content;
    const row = document.createElement('div'); row.className = 'row';
    const copy = document.createElement('button'); copy.textContent = 'Копировать';
    copy.onclick = async () => { try { await navigator.clipboard.writeText(it.content); status('Скопировано', 'ok'); } catch { status('Не удалось скопировать', 'err'); } };
    const exp = document.createElement('button'); exp.className = 'ghost'; exp.textContent = 'Развернуть';
    exp.onclick = () => { pre.classList.toggle('open'); exp.textContent = pre.classList.contains('open') ? 'Свернуть' : 'Развернуть'; };
    const del = document.createElement('button'); del.className = 'ghost danger'; del.textContent = 'Удалить';
    del.onclick = async () => {
      del.disabled = true;
      try { await gh('/gists/' + gistId, { method: 'PATCH', body: JSON.stringify({ files: { [it.name]: null } }) }); card.remove(); lastSig = ''; }
      catch (e) { status(e.message, 'err'); del.disabled = false; }
    };
    const sp = document.createElement('span'); sp.className = 'grow';
    row.append(copy, exp, sp, del);
    card.append(meta, pre, row);
    list.append(card);
  }
}

async function send() {
  const text = $('text').value;
  if (!text.trim()) return;
  $('send').disabled = true;
  try {
    await ensureGist();
    const name = Date.now() + '.txt';
    await gh('/gists/' + gistId, { method: 'PATCH', body: JSON.stringify({ files: { [name]: { content: text } } }) });
    $('text').value = '';
    status('Отправлено', 'ok');
    await load();
  } catch (e) { status(e.message, 'err'); }
  $('send').disabled = false;
}

const toB64 = file => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(',')[1] || '');
  r.onerror = () => rej(r.error);
  r.readAsDataURL(file);
});

async function uploadFiles(files) {
  files = [...files];
  if (!files.length) return;
  $('send').disabled = true;
  try {
    await ensureGist();
    let n = 0;
    for (const file of files) {
      n++;
      if (!file.size) { status(file.name + ': пустой файл', 'err'); continue; }
      if (file.size > MAX_FILE) { status(file.name + ': больше ' + fmtSize(MAX_FILE), 'err'); continue; }
      status(`Загрузка ${n}/${files.length}: ${file.name}…`);
      const ts = Date.now() + n, blob = ts + '.b64';
      const r = await gh('/gists/' + filesId, { method: 'PATCH', body: JSON.stringify({ files: { [blob]: { content: await toB64(file) } } }) });
      const meta = { name: file.name, type: file.type, size: file.size, blob, url: r.files[blob].raw_url };
      await gh('/gists/' + gistId, { method: 'PATCH', body: JSON.stringify({ files: { [ts + '.meta.json']: { content: JSON.stringify(meta) } } }) });
    }
    status('Отправлено', 'ok');
    await load();
  } catch (e) { status(e.message, 'err'); }
  $('send').disabled = false;
}

function logout() {
  store.del('pb_token'); store.del('pb_gist'); store.del('pb_files'); token = gistId = filesId = null; lastSig = '';
  show();
}

function show() {
  $('setup').classList.toggle('hidden', !!token);
  $('pinForm').classList.toggle('hidden', !window.PB_SEALED);
  $('sealForm').classList.toggle('hidden', !!window.PB_SEALED);
  $('app').classList.toggle('hidden', !token);
  if (token) load();
}

$('pinGo').onclick = async () => {
  $('pinErr').textContent = '';
  try { token = await unseal($('pin').value.trim(), window.PB_SEALED); store.set('pb_token', token); $('pin').value = ''; show(); }
  catch { $('pinErr').textContent = 'Неверный PIN'; }
};
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('pinGo').click(); });
let sealedTok = null;
$('sealGo').onclick = async () => {
  const t = $('token').value.trim(), pin = $('newPin').value.trim();
  if (!t || !pin) { $('sealErr').textContent = 'Нужны токен и PIN'; return; }
  $('sealErr').textContent = 'Шифрую…';
  try {
    const c = await seal(t, pin);
    $('sealText').value = 'window.PB_SEALED = ' + JSON.stringify(c) + ';\n';
    $('sealOut').classList.remove('hidden'); $('sealErr').textContent = ''; sealedTok = t;
  } catch (e) { $('sealErr').textContent = 'Ошибка: ' + e.message; }
};
$('sealCopy').onclick = async () => { try { await navigator.clipboard.writeText($('sealText').value); } catch { $('sealText').select(); } };
$('sealDone').onclick = () => { token = sealedTok; store.set('pb_token', token); $('token').value = ''; show(); };
$('logout').onclick = () => { if (confirm('Забыть токен на этом устройстве?')) logout(); };
$('send').onclick = send;
$('attach').onclick = () => $('file').click();
$('file').onchange = e => { uploadFiles(e.target.files); e.target.value = ''; };
let dragN = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragN++; document.body.classList.add('drag'); });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; document.body.classList.remove('drag'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; document.body.classList.remove('drag'); if (token) uploadFiles(e.dataTransfer.files); });
addEventListener('paste', e => { if (token && e.clipboardData.files.length) { e.preventDefault(); uploadFiles(e.clipboardData.files); } });
$('text').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') send(); });
$('paste').onclick = async () => { try { $('text').value = await navigator.clipboard.readText(); } catch { status('Нет доступа к буферу', 'err'); } };
setInterval(() => { if (token && !document.hidden) load(); }, 5000);
document.addEventListener('visibilitychange', () => { if (token && !document.hidden) load(); });
show();
</script>
</body>
</html>
